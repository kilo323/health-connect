server {
    listen ${FRONTEND_PORT};
    server_name _;
    absolute_redirect off;
    root /app/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:${BACKEND_PORT}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # nginx defaults these to 60s. The "Generate proposals" endpoint streams
        # two chat/completions from the LLM before it can reply, so it takes ~100s
        # end to end; at 60s nginx returned 504 Gateway Time-out to the browser and
        # closed the upstream connection while the backend was still working. The
        # UI therefore never got a response, and uvicorn never logged the request
        # (aborted connections are not access-logged), which looked like a hang.
        # 300s matches the httpx client timeout used for those LLM calls, so nginx
        # now waits as long as the backend is willing to.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
