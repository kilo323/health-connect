services:
  app:
    build: .
    container_name: health-connect
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./data:/app/data
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      DATABASE_URL: sqlite+aiosqlite:///./data/health_tracker.db
      FERNET_KEY: ${FERNET_KEY:-$(openssl rand -hex 32)}

