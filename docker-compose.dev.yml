services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: health-tracker-dev
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      # Mount corporate CA cert so the container trusts your proxy
      - ./certs:/usr/local/share/ca-certificates:ro
      # Mount source code for live reload
      # Backend: match production layout (app/ contents → /app/)
      - ./app:/app
      # Frontend: override with host source for HMR (more specific mount wins)
      - ./app/frontend:/app/frontend
      # Persist database and data
      - ./data:/app/data
      # Persist node_modules so npm install isn't lost on mount
      - frontend_node_modules:/app/frontend/node_modules
      # Persist Next.js cache for faster rebuilds
      - frontend_next:/app/frontend/.next
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - LLM_API_TOKEN=${LLM_API_TOKEN:-your-provider-token-here}
      - LLM_URL=${LLM_URL:-https://your-provider.com/v1}
      - LLM_MODEL=${LLM_MODEL:-your-model-name}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/health_tracker.db
      - FERNET_KEY=${FERNET_KEY:-$(openssl rand -hex 32)}
      # Signal Next.js to use dev server instead of static export
      - NODE_ENV=development
      # Force polling-based file watching for uvicorn reload inside Docker
      # (inotify events are unreliable through Windows/macOS volume mounts)
      - WATCHFILES_FORCE_POLLING=true
      - WATCHPACK_POLLING=true
      # Point Python (httpx/certifi) at the system CA bundle that includes
      # any corporate certs registered by update-ca-certificates
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt

volumes:
  frontend_node_modules:
  frontend_next:
