services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: health-connect-dev
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      # Mount corporate CA cert so the container trusts your proxy
      - ./certs:/usr/local/share/ca-certificates:ro
      # Mount source code for live reload
      # Backend: match production layout (app/ contents → /app/)
      - ./app:/app
      # Frontend: override with host source for HMR (more specific mount wins)
      - ./app/frontend:/app/frontend
      # Persist database and data
      - ./data:/app/data
      # Persist node_modules so npm install isn't lost on mount
      - frontend_node_modules:/app/frontend/node_modules
      # Persist Next.js cache for faster rebuilds
      - frontend_next:/app/frontend/.next
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - LLM_API_TOKEN=${LLM_API_TOKEN:-your-provider-token-here}
      - LLM_URL=${LLM_URL:-https://your-provider.com/v1}
      - LLM_MODEL=${LLM_MODEL:-your-model-name}
      # Optional separate LLM for metric library refresh; empty → fall back to LLM_*
      - METRIC_LLM_URL=${METRIC_LLM_URL:-}
      - METRIC_LLM_API_TOKEN=${METRIC_LLM_API_TOKEN:-}
      - METRIC_LLM_MODEL=${METRIC_LLM_MODEL:-}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/health_tracker.db
      - FERNET_KEY=${FERNET_KEY:-$(openssl rand -hex 32)}
      # Signal Next.js to use dev server instead of static export
      - NODE_ENV=development
      # File watching mode for uvicorn/Next.js inside Docker.
      # Only set WATCHFILES_FORCE_POLLING=true / WATCHPACK_POLLING=true if
      # hot-reload doesn't work at all — polling a Windows bind mount is the
      # main cause of 100% CPU. Any non-empty value is treated as "on", so
      # these default to empty (disabled).
      - WATCHFILES_FORCE_POLLING=${WATCHFILES_FORCE_POLLING:-}
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-}
      # Narrow watchpack's scope so it doesn't poll node_modules / .next
      - WATCHPACK_WATCHER_LIMIT=2000
      # Make the `app` package importable regardless of uvicorn's CWD/sys.path
      # handling (fixes "No module named app" when reload excludes are set).
      - PYTHONPATH=/app
      # Point Python (httpx/certifi) at the system CA bundle that includes
      # any corporate certs registered by update-ca-certificates
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt

volumes:
  frontend_node_modules:
  frontend_next:
